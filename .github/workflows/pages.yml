name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build and test the tutorial
        run: nix run .#just -- test
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp src/index.html src/contents.html src/[0-9]*.html src/where-to-wander-next.html src/browser.css _site/
          cp src/browser.mjs src/browser-worker.mjs src/code-context.mjs _site/
          cp src/editor.mjs src/editor-compiler-worker.mjs src/editor-execution-worker.mjs _site/
          cp src/[0-9][0-9]-*.bend _site/
          cp -R src/generated _site/generated
          touch _site/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
